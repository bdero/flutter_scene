name: smoke render jobs

on:
  workflow_call:
    inputs:
      flutter_channel:
        required: true
        type: string
      label:
        required: true
        type: string
      argos_prefix:
        required: false
        type: string
        default: ""
      reference_branch:
        required: false
        type: string
        default: ""
      checkout_ref:
        required: false
        type: string
        default: ""
      upload_argos_on_push:
        description: >
          Upload rendered frames to Argos on push events. Set false to save
          Argos quota on master-push runs; pull-request, scheduled (nightly),
          and manual runs always upload regardless.
        required: false
        type: boolean
        default: true
    secrets:
      ARGOS_TOKEN:
        required: false
      DISCORD_WEBHOOK_URL:
        required: false

env:
  FLUTTER_DART_DATA_ASSETS: "true"
  # The repo has more than one Argos project, so uploads name the target
  # explicitly instead of relying on repository lookup.
  ARGOS_PROJECT: scene/flutter_scene

jobs:
  linux:
    name: ${{ inputs.argos_prefix }}linux (${{ inputs.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # No GPU on the runner; force Mesa's software rasterizers (GL llvmpipe,
      # Vulkan lavapipe) so Impeller has a backend under Xvfb.
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v7
        if: ${{ inputs.checkout_ref != '' }}
        with:
          ref: ${{ inputs.checkout_ref }}
      - uses: actions/checkout@v7
        if: ${{ inputs.checkout_ref == '' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
      - name: Flutter and engine revision
        run: flutter --version
      - name: Install Linux desktop build deps + software GL/Vulkan + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            xvfb libgl1-mesa-dri libegl-mesa0 libgles2 mesa-vulkan-drivers
      # No data assets here. These shards render what a consumer gets, where
      # flutter_scene's hook compiles the engine's shaders into its own
      # generated tree. The Apple shards keep the data-assets opt-in covered.
      - run: flutter config --enable-linux-desktop --enable-native-assets
      - run: flutter pub get
      - name: Render smoke scenes
        working-directory: examples/smoke_render
        run: >
          xvfb-run -a -s "-screen 0 1280x1024x24"
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/smoke_test.dart
          -d linux --enable-impeller --enable-flutter-gpu
      - name: Upload to Argos
        id: argos
        if: ${{ !cancelled() && (github.event_name != 'push' || inputs.upload_argos_on_push) }}
        working-directory: examples/smoke_render
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
        run: |
          # Never upload an empty/partial build: a failed render must not
          # overwrite the Argos baseline (see the android job, and
          # notes/ci/argos_visual_baseline_tracking.md).
          if [ ! -d build/smoke ] || ! find build/smoke -type f -name '*.png' | grep -q .; then
            echo "No smoke screenshots found; skipping Argos upload."
            exit 0
          fi
          reference_args=()
          if [ -n "${{ inputs.reference_branch }}" ]; then
            reference_args=(--reference-branch "${{ inputs.reference_branch }}")
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              export ARGOS_BRANCH="${{ inputs.reference_branch }}"
              export ARGOS_COMMIT="$(git rev-parse HEAD)"
            fi
          fi
          status=0
          out=$(npx --yes @argos-ci/cli upload build/smoke --project "$ARGOS_PROJECT" --build-name "${{ inputs.argos_prefix }}linux" "${reference_args[@]}" 2>&1) || status=$?
          echo "$out"
          # The grep misses when the upload printed no URL; that miss must not
          # fail the step, which runs with pipefail on windows.
          url=$(printf '%s' "$out" | grep -oE 'https://app\.argos-ci\.com/[^[:space:]]+' | head -1) || true
          echo "build_url=$url" >> "$GITHUB_OUTPUT"
          # Tokenless auth covers fork PRs, so every run can upload. A failed
          # upload means no visual diff at all and must not pass silently.
          exit "$status"
      - name: Notify Discord on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ARGOS_URL: ${{ steps.argos.outputs.build_url }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && exit 0
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          CONTENT="Smoke render failed (${{ inputs.argos_prefix }}linux, ${{ inputs.label }}). Run: $RUN_URL"
          [ -n "$ARGOS_URL" ] && CONTENT="$CONTENT  |  Argos: $ARGOS_URL"
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\": \"$CONTENT\"}" "$DISCORD_WEBHOOK_URL" || true

  android:
    name: ${{ inputs.argos_prefix }}android_${{ matrix.backend }} (${{ inputs.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    strategy:
      fail-fast: false
      matrix:
        include:
          # swangle_indirect renders GLES through ANGLE on SwiftShader Vulkan.
          # The legacy swiftshader_indirect translator (SwiftShader 4.0 GL)
          # drops most analytic-light contribution, so every sun/punctual-lit
          # scene rendered dark on this lane before the switch.
          - backend: gles
            expected_backend: opengles
            emulator_options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          - backend: vulkan
            expected_backend: vulkan
            emulator_options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
    steps:
      - uses: actions/checkout@v7
        if: ${{ inputs.checkout_ref != '' }}
        with:
          ref: ${{ inputs.checkout_ref }}
      - uses: actions/checkout@v7
        if: ${{ inputs.checkout_ref == '' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
      - name: Flutter and engine revision
        run: flutter --version
      - run: flutter config --enable-native-assets
      - run: flutter pub get
      - name: Engine revision
        id: engine
        run: echo "revision=$(flutter --version --machine | jq -r .engineRevision)" >> "$GITHUB_OUTPUT"
      # Gradle downloads and the engine's compiled shaders carry over between
      # runs. Every generated output is stamped with its inputs' content and the
      # engine identity, so a stale restore is rebuilt, never reused.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('examples/smoke_render/android/**/*.gradle*', 'examples/smoke_render/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-gradle-
      - uses: actions/cache@v6
        with:
          path: |
            packages/flutter_scene/flutter_scene_generated
            examples/smoke_render/flutter_scene_generated
          key: android-scene-generated-${{ matrix.backend }}-${{ steps.engine.outputs.revision }}-${{ hashFiles('packages/flutter_scene/shaders/**', 'examples/smoke_render/shaders/**', 'examples/smoke_render/assets/**') }}
          restore-keys: |
            android-scene-generated-${{ matrix.backend }}-${{ steps.engine.outputs.revision }}-
            android-scene-generated-${{ matrix.backend }}-
      # Built before the emulator boots, so the build has the whole runner and
      # the drive's time caps cover only the tests.
      - name: Build smoke APK
        working-directory: examples/smoke_render
        run: >
          flutter build apk --debug
          --flavor ${{ matrix.backend }}
          --target=integration_test/smoke_test.dart
          --dart-define=SMOKE_EXPECTED_ANDROID_IMPELLER_BACKEND=${{ matrix.expected_backend }}
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render smoke scenes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          # Emulator 36.1.9. The 37.1.11 Linux build's SwANGLE host renderer
          # crashes the whole emulator a few frames into the app under
          # -gpu swangle_indirect.
          # TODO(swangle-crash): minimize a repro and file the upstream
          # emulator bug (#314), then drop the pin once a fixed build ships.
          emulator-build: 13823996
          emulator-options: ${{ matrix.emulator_options }}
          # Caps, retry, capture pulls, and diagnostics live in the script.
          script: bash examples/smoke_render/tool/android_drive.sh ${{ matrix.backend }} build/app/outputs/flutter-apk/app-${{ matrix.backend }}-debug.apk
      - name: Upload Android diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-diagnostics-${{ inputs.argos_prefix }}android_${{ matrix.backend }}
          path: examples/smoke_render/build/android-diagnostics
          if-no-files-found: ignore
      - name: Upload to Argos
        id: argos
        if: ${{ !cancelled() && (github.event_name != 'push' || inputs.upload_argos_on_push) }}
        working-directory: examples/smoke_render
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
        run: |
          # Never upload an empty/partial build: a failed render must not
          # overwrite the Argos baseline (see
          # notes/ci/argos_visual_baseline_tracking.md).
          if [ ! -d build/smoke ] || ! find build/smoke -type f -name '*.png' | grep -q .; then
            echo "No smoke screenshots found; skipping Argos upload."
            exit 0
          fi
          reference_args=()
          if [ -n "${{ inputs.reference_branch }}" ]; then
            reference_args=(--reference-branch "${{ inputs.reference_branch }}")
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              export ARGOS_BRANCH="${{ inputs.reference_branch }}"
              export ARGOS_COMMIT="$(git rev-parse HEAD)"
            fi
          fi
          status=0
          out=$(npx --yes @argos-ci/cli upload build/smoke --project "$ARGOS_PROJECT" --build-name "${{ inputs.argos_prefix }}android_${{ matrix.backend }}" "${reference_args[@]}" 2>&1) || status=$?
          echo "$out"
          # The grep misses when the upload printed no URL; that miss must not
          # fail the step, which runs with pipefail on windows.
          url=$(printf '%s' "$out" | grep -oE 'https://app\.argos-ci\.com/[^[:space:]]+' | head -1) || true
          echo "build_url=$url" >> "$GITHUB_OUTPUT"
          # Tokenless auth covers fork PRs, so every run can upload. A failed
          # upload means no visual diff at all and must not pass silently.
          exit "$status"
      - name: Notify Discord on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ARGOS_URL: ${{ steps.argos.outputs.build_url }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && exit 0
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          CONTENT="Smoke render failed (${{ inputs.argos_prefix }}android_${{ matrix.backend }}, ${{ inputs.label }}). Run: $RUN_URL"
          [ -n "$ARGOS_URL" ] && CONTENT="$CONTENT  |  Argos: $ARGOS_URL"
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\": \"$CONTENT\"}" "$DISCORD_WEBHOOK_URL" || true

  web:
    name: ${{ inputs.argos_prefix }}web (${{ inputs.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        if: ${{ inputs.checkout_ref != '' }}
        with:
          ref: ${{ inputs.checkout_ref }}
      - uses: actions/checkout@v7
        if: ${{ inputs.checkout_ref == '' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
      - name: Flutter and engine revision
        run: flutter --version
      - run: flutter config --enable-native-assets
      - run: flutter pub get
      - uses: nanasess/setup-chromedriver@v3
      - name: Render smoke scenes
        working-directory: examples/smoke_render
        run: |
          chromedriver --port=4444 &
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/smoke_test.dart \
            -d web-server --browser-name=chrome --headless --driver-port=4444
      - name: Keep frames for the WebGPU parity check
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.argos_prefix }}smoke-web-frames
          path: examples/smoke_render/build/smoke
          if-no-files-found: ignore
      - name: Upload to Argos
        id: argos
        if: ${{ !cancelled() && (github.event_name != 'push' || inputs.upload_argos_on_push) }}
        working-directory: examples/smoke_render
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
        run: |
          # Never upload an empty/partial build: a failed render must not
          # overwrite the Argos baseline (see the android job, and
          # notes/ci/argos_visual_baseline_tracking.md).
          if [ ! -d build/smoke ] || ! find build/smoke -type f -name '*.png' | grep -q .; then
            echo "No smoke screenshots found; skipping Argos upload."
            exit 0
          fi
          reference_args=()
          if [ -n "${{ inputs.reference_branch }}" ]; then
            reference_args=(--reference-branch "${{ inputs.reference_branch }}")
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              export ARGOS_BRANCH="${{ inputs.reference_branch }}"
              export ARGOS_COMMIT="$(git rev-parse HEAD)"
            fi
          fi
          status=0
          out=$(npx --yes @argos-ci/cli upload build/smoke --project "$ARGOS_PROJECT" --build-name "${{ inputs.argos_prefix }}web" "${reference_args[@]}" 2>&1) || status=$?
          echo "$out"
          # The grep misses when the upload printed no URL; that miss must not
          # fail the step, which runs with pipefail on windows.
          url=$(printf '%s' "$out" | grep -oE 'https://app\.argos-ci\.com/[^[:space:]]+' | head -1) || true
          echo "build_url=$url" >> "$GITHUB_OUTPUT"
          # Tokenless auth covers fork PRs, so every run can upload. A failed
          # upload means no visual diff at all and must not pass silently.
          exit "$status"
      - name: Notify Discord on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ARGOS_URL: ${{ steps.argos.outputs.build_url }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && exit 0
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          CONTENT="Smoke render failed (${{ inputs.argos_prefix }}web, ${{ inputs.label }}). Run: $RUN_URL"
          [ -n "$ARGOS_URL" ] && CONTENT="$CONTENT  |  Argos: $ARGOS_URL"
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\": \"$CONTENT\"}" "$DISCORD_WEBHOOK_URL" || true

  # The web lane again on the WebGPU backend: SwiftShader's Vulkan under
  # headless Chrome (without the Vulkan flags every canvas read returns zeros),
  # and WGSL sidecars from a Tint built here until a release exists.
  web-webgpu:
    name: ${{ inputs.argos_prefix }}web-webgpu (${{ inputs.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        if: ${{ inputs.checkout_ref != '' }}
        with:
          ref: ${{ inputs.checkout_ref }}
      - uses: actions/checkout@v7
        if: ${{ inputs.checkout_ref == '' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
      - name: Flutter and engine revision
        run: flutter --version
      - run: flutter config --enable-native-assets
      - uses: actions/cache/restore@v6
        id: tint-cache
        with:
          path: ${{ runner.temp }}/tint
          key: tint-${{ runner.os }}-${{ hashFiles('tools/tint_cli/**') }}
      - uses: seanmiddleditch/gha-setup-ninja@v6
        if: ${{ steps.tint-cache.outputs.cache-hit != 'true' }}
      - name: Build flutter_scene_tint
        run: tools/webgpu_smoke/ensure_tint.sh "$RUNNER_TEMP/tint"
      # Saved before rendering, so a failed render still keeps the build.
      - uses: actions/cache/save@v6
        if: ${{ steps.tint-cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ runner.temp }}/tint
          key: tint-${{ runner.os }}-${{ hashFiles('tools/tint_cli/**') }}
      - name: Opt in to WGSL sidecars
        run: tools/webgpu_smoke/opt_in.sh "$RUNNER_TEMP/tint/flutter_scene_tint"
      - run: flutter pub get
      - uses: nanasess/setup-chromedriver@v3
      - name: Render smoke scenes
        working-directory: examples/smoke_render
        run: |
          chromedriver --port=4444 &
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/smoke_test.dart \
            -d web-server --browser-name=chrome --headless --driver-port=4444 \
            --dart-define=flutter_scene.webgpu=true \
            --web-browser-flag=--enable-unsafe-webgpu \
            --web-browser-flag=--enable-features=Vulkan \
            --web-browser-flag=--use-vulkan=swiftshader
      - name: Keep frames for the WebGPU parity check
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.argos_prefix }}smoke-web-webgpu-frames
          path: examples/smoke_render/build/smoke
          if-no-files-found: ignore
      - name: Upload to Argos
        id: argos
        if: ${{ !cancelled() && (github.event_name != 'push' || inputs.upload_argos_on_push) }}
        working-directory: examples/smoke_render
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
        run: |
          # Never upload an empty/partial build: a failed render must not
          # overwrite the Argos baseline (see the android job, and
          # notes/ci/argos_visual_baseline_tracking.md).
          if [ ! -d build/smoke ] || ! find build/smoke -type f -name '*.png' | grep -q .; then
            echo "No smoke screenshots found; skipping Argos upload."
            exit 0
          fi
          reference_args=()
          if [ -n "${{ inputs.reference_branch }}" ]; then
            reference_args=(--reference-branch "${{ inputs.reference_branch }}")
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              export ARGOS_BRANCH="${{ inputs.reference_branch }}"
              export ARGOS_COMMIT="$(git rev-parse HEAD)"
            fi
          fi
          status=0
          out=$(npx --yes @argos-ci/cli upload build/smoke --project "$ARGOS_PROJECT" --build-name "${{ inputs.argos_prefix }}web-webgpu" "${reference_args[@]}" 2>&1) || status=$?
          echo "$out"
          # The grep misses when the upload printed no URL; that miss must not
          # fail the step, which runs with pipefail on windows.
          url=$(printf '%s' "$out" | grep -oE 'https://app\.argos-ci\.com/[^[:space:]]+' | head -1) || true
          echo "build_url=$url" >> "$GITHUB_OUTPUT"
          # Tokenless auth covers fork PRs, so every run can upload. A failed
          # upload means no visual diff at all and must not pass silently.
          exit "$status"
      - name: Notify Discord on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ARGOS_URL: ${{ steps.argos.outputs.build_url }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && exit 0
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          CONTENT="Smoke render failed (${{ inputs.argos_prefix }}web-webgpu, ${{ inputs.label }}). Run: $RUN_URL"
          [ -n "$ARGOS_URL" ] && CONTENT="$CONTENT  |  Argos: $ARGOS_URL"
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\": \"$CONTENT\"}" "$DISCORD_WEBHOOK_URL" || true

  # WebGPU must render what WebGL2 renders. Both lanes run SwiftShader, so
  # the frames differ by rasterizer rounding only.
  web-parity:
    name: ${{ inputs.argos_prefix }}web-parity (${{ inputs.label }})
    needs: [web, web-webgpu]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        if: ${{ inputs.checkout_ref != '' }}
        with:
          ref: ${{ inputs.checkout_ref }}
      - uses: actions/checkout@v7
        if: ${{ inputs.checkout_ref == '' }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.argos_prefix }}smoke-web-frames
          path: frames/webgl2
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.argos_prefix }}smoke-web-webgpu-frames
          path: frames/webgpu
      - run: pip install --quiet pillow numpy
      - name: Compare WebGPU against WebGL2
        run: python3 tools/webgpu_smoke/compare_frames.py frames/webgl2 frames/webgpu --diff-dir frames/diff
      - name: Keep the differences
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.argos_prefix }}smoke-web-parity-diff
          path: frames/diff
          if-no-files-found: ignore

  windows:
    name: ${{ inputs.argos_prefix }}windows (${{ inputs.label }})
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        if: ${{ inputs.checkout_ref != '' }}
        with:
          ref: ${{ inputs.checkout_ref }}
      - uses: actions/checkout@v7
        if: ${{ inputs.checkout_ref == '' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
      - name: Flutter and engine revision
        run: flutter --version
      - run: flutter config --enable-windows-desktop --enable-native-assets
      - run: flutter pub get
      - name: Render smoke scenes
        working-directory: examples/smoke_render
        # No GPU on the runner. Windows Impeller renders through ANGLE, which
        # falls back to the D3D11 WARP software rasterizer when no hardware
        # adapter is present, so no extra graphics setup is needed (unlike the
        # Linux job, which installs Mesa's software GL/Vulkan).
        run: >
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/smoke_test.dart
          -d windows --enable-impeller --enable-flutter-gpu
      - name: Upload to Argos
        id: argos
        if: ${{ !cancelled() && (github.event_name != 'push' || inputs.upload_argos_on_push) }}
        working-directory: examples/smoke_render
        shell: bash
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
        run: |
          # Never upload an empty/partial build: a failed render must not
          # overwrite the Argos baseline (see the android job, and
          # notes/ci/argos_visual_baseline_tracking.md).
          if [ ! -d build/smoke ] || ! find build/smoke -type f -name '*.png' | grep -q .; then
            echo "No smoke screenshots found; skipping Argos upload."
            exit 0
          fi
          reference_args=()
          if [ -n "${{ inputs.reference_branch }}" ]; then
            reference_args=(--reference-branch "${{ inputs.reference_branch }}")
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              export ARGOS_BRANCH="${{ inputs.reference_branch }}"
              export ARGOS_COMMIT="$(git rev-parse HEAD)"
            fi
          fi
          status=0
          out=$(npx --yes @argos-ci/cli upload build/smoke --project "$ARGOS_PROJECT" --build-name "${{ inputs.argos_prefix }}windows" "${reference_args[@]}" 2>&1) || status=$?
          echo "$out"
          # The grep misses when the upload printed no URL; that miss must not
          # fail the step, which runs with pipefail on windows.
          url=$(printf '%s' "$out" | grep -oE 'https://app\.argos-ci\.com/[^[:space:]]+' | head -1) || true
          echo "build_url=$url" >> "$GITHUB_OUTPUT"
          # Tokenless auth covers fork PRs, so every run can upload. A failed
          # upload means no visual diff at all and must not pass silently.
          exit "$status"
      - name: Notify Discord on failure
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ARGOS_URL: ${{ steps.argos.outputs.build_url }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && exit 0
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          CONTENT="Smoke render failed (${{ inputs.argos_prefix }}windows, ${{ inputs.label }}). Run: $RUN_URL"
          [ -n "$ARGOS_URL" ] && CONTENT="$CONTENT  |  Argos: $ARGOS_URL"
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\": \"$CONTENT\"}" "$DISCORD_WEBHOOK_URL" || true
