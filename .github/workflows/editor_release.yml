name: flutter_scene_editor distribution

# Builds and packages the standalone Flutter Scene Editor for macOS, Linux,
# and Windows and attaches the archives plus a checksum manifest to a GitHub
# release. Every job builds against the exact flutter/flutter revision pinned
# in apps/flutter_scene_editor_app/flutter.version, so the packaged engine,
# the bundled impellerc, and the shader bundle format stay in lockstep.
#
# Triggers on a flutter_scene_editor-* tag push, or run manually with a tag
# input. A tag whose name contains "citest" builds the whole matrix but skips
# the release step, so the packaging can be validated without publishing.
#
# macOS signing/notarization run only when MACOS_CERTIFICATE_P12 is set.
# Signing needs MACOS_CERTIFICATE_P12 (base64 of a Developer ID Application
# .p12) and MACOS_CERTIFICATE_PASSWORD (its export password); the identity is
# resolved from the imported certificate by its hash. Notarization also needs
# MACOS_NOTARY_PROFILE (any handle), MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_PASSWORD
# (an app-specific password), and MACOS_NOTARY_TEAM_ID. Missing the cert ->
# unsigned build.

on:
  push:
    tags:
      - 'flutter_scene_editor-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach archives to (e.g. flutter_scene_editor-0.1.0)'
        required: true

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, platform: macos }
          # Linux and Windows are held back from the first releases. They still
          # build profile (not release) for Flutter GPU pending
          # flutter/flutter#190872, and Windows is unsigned. Restore these once
          # those are sorted.
          # - { runner: ubuntu-latest, platform: linux }
          # - { runner: windows-latest, platform: windows }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Check out pinned Flutter
        run: |
          REVISION=$(grep -v '^#' apps/flutter_scene_editor_app/flutter.version | tr -d '[:space:]')
          git clone https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout "$REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      # No windowing patch or `flutter config --enable-windowing` here: the app
      # opts itself in by setting isWindowingEnabled in main(), which is what
      # the dart-define the tool refuses to pass on stable would have done.
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
          flutter config --enable-${{ matrix.platform }}-desktop
          flutter doctor -v
          flutter precache --${{ matrix.platform }}

      - name: Resolve dependencies
        run: flutter pub get

      # Keychain setup and packaging run in one step on purpose: the search
      # list and default keychain do not reliably persist across steps on the
      # runner, so the packager's codesign must find the identity in the same
      # process that imported it. No certificate secret -> unsigned build that
      # still produces a DMG.
      - name: Package
        working-directory: apps/flutter_scene_editor_app
        env:
          PLATFORM: ${{ matrix.platform }}
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          ARGS=(--platform "$PLATFORM")
          if [ "$PLATFORM" = "macos" ] && [ -n "$CERTIFICATE_P12" ]; then
            KEYCHAIN="$RUNNER_TEMP/editor-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
              -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/cert.p12"
            # Let codesign use the imported key without an interactive prompt.
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" \
              $(security list-keychains -d user | sed 's/[" ]//g')
            security default-keychain -s "$KEYCHAIN"
            xcrun notarytool store-credentials "$NOTARY_PROFILE" \
              --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" \
              --password "$NOTARY_PASSWORD" \
              --keychain "$KEYCHAIN"
            # codesign matches -s against the SHA-1 hash exactly, sidestepping
            # any whitespace or punctuation mismatch in the identity-name secret.
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
              | awk '/Developer ID Application/ {print $2; exit}')
            if [ -z "$IDENTITY" ]; then
              echo "No Developer ID Application identity in $KEYCHAIN" >&2
              exit 1
            fi
            echo "Signing with identity $IDENTITY"
            ARGS+=(--sign-identity "$IDENTITY" \
                   --notarize-profile "$NOTARY_PROFILE" \
                   --keychain "$KEYCHAIN")
          fi
          dart tool/package_editor.dart "${ARGS[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: editor-${{ matrix.platform }}
          path: apps/flutter_scene_editor_app/build/dist/*
          if-no-files-found: error

  release:
    name: Attach to release
    needs: package
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, 'citest') && !contains(inputs.tag, 'citest') }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Build checksum manifest
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes "Flutter Scene Editor distribution $TAG" --draft
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
