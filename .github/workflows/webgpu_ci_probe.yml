name: WebGPU branch checks

# The WebGPU backend's browser tests, and the WebGPU smoke lane compared with
# WebGL2, on pushes to the backend's branch. The smoke render workflow runs
# the same lane (web-webgpu and web-parity) for pull requests and master.
# TODO(webgpu-ci-lane): delete this workflow once the branch merges; move the
# browser tests into flutter.yml.

on:
  push:
    branches: [bdero/webgpu-web-backend]

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: master
      - run: flutter --version && google-chrome --version
      - run: flutter pub get
      - name: WebGPU browser tests
        working-directory: packages/flutter_scene
        env:
          CHROME_EXECUTABLE: ${{ github.workspace }}/tools/webgpu_ci_probe/chrome_with_flags.sh
          # Without Vulkan SwiftShader, Chrome renders WebGPU but every read
          # of its canvas returns zeros.
          CHROME_EXTRA_FLAGS: --enable-unsafe-webgpu --enable-features=Vulkan --use-vulkan=swiftshader
        run: |
          for mode in "" --wasm; do
            echo "::group::${mode:-canvaskit}"
            flutter test --platform chrome $mode \
              --dart-define=flutter_scene.webgpu=true test/gpu/webgpu/
            echo "::endgroup::"
          done

  smoke-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: master
      - run: flutter config --enable-native-assets
      - uses: actions/cache/restore@v6
        id: tint-cache
        with:
          path: ${{ runner.temp }}/tint
          key: tint-${{ runner.os }}-${{ hashFiles('tools/tint_cli/**') }}
      - uses: seanmiddleditch/gha-setup-ninja@v6
        if: ${{ steps.tint-cache.outputs.cache-hit != 'true' }}
      - name: Build flutter_scene_tint
        run: tools/webgpu_smoke/ensure_tint.sh "$RUNNER_TEMP/tint"
      - uses: actions/cache/save@v6
        if: ${{ steps.tint-cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ runner.temp }}/tint
          key: tint-${{ runner.os }}-${{ hashFiles('tools/tint_cli/**') }}
      - name: Opt in to WGSL sidecars
        run: tools/webgpu_smoke/opt_in.sh "$RUNNER_TEMP/tint/flutter_scene_tint"
      - run: flutter pub get
      - uses: nanasess/setup-chromedriver@v3
      - name: Render on WebGL2 and on WebGPU
        working-directory: examples/smoke_render
        run: |
          chromedriver --port=4444 &
          render() {
            rm -rf build/smoke
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/smoke_test.dart \
              -d web-server --browser-name=chrome --headless --driver-port=4444 \
              "$@"
          }
          status=0
          render || status=$?
          mkdir -p "$GITHUB_WORKSPACE/frames" && cp -r build/smoke "$GITHUB_WORKSPACE/frames/webgl2"
          render --dart-define=flutter_scene.webgpu=true \
            --web-browser-flag=--enable-unsafe-webgpu \
            --web-browser-flag=--enable-features=Vulkan \
            --web-browser-flag=--use-vulkan=swiftshader || status=$?
          cp -r build/smoke "$GITHUB_WORKSPACE/frames/webgpu"
          exit $status
      - run: pip install --quiet pillow numpy
        if: ${{ !cancelled() }}
      - name: Compare WebGPU against WebGL2
        if: ${{ !cancelled() }}
        run: python3 tools/webgpu_smoke/compare_frames.py frames/webgl2 frames/webgpu --diff-dir frames/diff
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: smoke-frames
          path: frames
          if-no-files-found: ignore
