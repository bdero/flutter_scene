name: fxc timing

on:
  push:
    branches: [bdero/fxc-timing]
  workflow_dispatch:

jobs:
  time:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        angle: [d3d11]
    defaults:
      run:
        shell: bash
        working-directory: fxc_timing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Time a warm-up of a realistic pipeline set
        run: |
          powershell -NoProfile -Command "(Get-Item 'C:\Program Files\Google\Chrome\Application\chrome.exe').VersionInfo.ProductVersion; (Get-CimInstance Win32_Processor).Name; (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors"
          RUNS=3 node warmup/time_warmup.mjs "/c/Program Files/Google/Chrome/Application/chrome.exe" results.json ${{ matrix.angle }} 2> chrome_stderr.log
      - name: Summary
        if: always()
        run: |
          {
            echo "### Warm-up, ANGLE ${{ matrix.angle }}"
            echo '| mode | cache | run | parallel | wall ms | blocked ms | longest slice ms | links issued ms | all ready ms | error |'
            echo '|---|---|---|---|---|---|---|---|---|---|'
            node -e '
              const f = (x) => x == null ? "" : Math.round(x);
              for (const r of require("fs").readFileSync("results.jsonl","utf8").split(/\r?\n/).filter(l => l.startsWith("{")).map(JSON.parse))
                console.log(`| ${r.mode} | ${r.cache} | ${r.run} | ${r.parallel} | ${f(r.wallMs)} | ${f(r.blockedMs)} | ${f(r.longestSliceMs)} | ${f(r.issuedMs)} | ${f(r.readyMs)} | ${r.error ?? r.glError} |`)'
            echo
            node -e '
              const r = require("fs").readFileSync("results.jsonl","utf8").split(/\r?\n/).filter(l => l.startsWith("{")).map(JSON.parse)[0];
              console.log("renderer: " + r.renderer);
              console.log("```"); console.log(JSON.stringify(r.drawMs, null, 1)); console.log("```");'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fxc-timing-${{ matrix.angle }}
          path: |
            fxc_timing/results.json
            fxc_timing/results.jsonl
            fxc_timing/chrome_stderr.log
