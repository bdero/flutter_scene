name: Flutter CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # Manual runs can pick a Flutter channel. Dispatching on the stable branch
  # defaults to the stable channel, so it runs the whole suite against the
  # latest Flutter stable without needing any input.
  workflow_dispatch:
    inputs:
      channel:
        description: "Flutter channel (empty picks stable on the stable branch, master elsewhere)"
        required: false
        default: ""

env:
  FLUTTER_DART_DATA_ASSETS: "true"
  FLUTTER_CHANNEL: ${{ inputs.channel || (github.ref_name == 'stable' && 'stable' || 'master') }}

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: dart --version
      - run: flutter --version
      - name: Resolve workspace dependencies
        run: flutter pub get
      - name: Enable asset building
        run: flutter config --enable-native-assets --enable-dart-data-assets
      - name: Lint analysis
        run: dart analyze packages examples
      - name: Dart format
        run: dart format --output none --set-exit-if-changed $(find . -name '**.dart' -not -path '*/build/*')

  test:
    name: Test ${{ matrix.package }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/scene
          - packages/flutter_scene
    steps:
      - uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Resolve workspace dependencies
        run: flutter pub get
      - name: Enable asset building
        run: flutter config --enable-native-assets --enable-dart-data-assets
      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: flutter test --enable-impeller
