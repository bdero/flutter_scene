name: flutter_scene_editor_app
description: The standalone Flutter Scene Editor desktop application.
publish_to: none

# Tracks the flutter_scene release this build pairs with.
version: 0.23.0

resolution: workspace

environment:
  sdk: ^3.10.0
  # Master builds sort below 3.47.0 and are excluded deliberately; the
  # windowing API the shell uses was renamed after stable.
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  data_assets: ^0.20.0
  file_selector: ^1.0.0
  flutter_scene: ^0.23.0
  scene: ^0.3.0
  flutter_scene_codegen:
    path: ../../packages/flutter_scene_codegen
  flutter_scene_editor:
    path: ../../packages/flutter_scene_editor
  flutter_scene_mcp:
    path: ../../packages/flutter_scene_mcp
  hooks: ^2.0.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Everything hook/build.dart generates, loaded by source path. Added
    # by `dart run flutter_scene:init`.
    - flutter_scene_generated/
