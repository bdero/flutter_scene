# Renders the deterministic smoke scenes on Apple GPUs and publishes the frames
# as build artifacts. Covers the two Metal backends GitHub Actions cannot host,
# because its macOS runners give the harness no virtual display; linux, android,
# web, and windows stay in .github/workflows/smoke_render_jobs.yml.
#
# Nothing here triggers on its own and nothing here holds a credential. Builds
# are started by .github/workflows/codemagic_smoke.yml, which collects the
# frames afterwards and uploads them to Argos. Keeping the secrets on the GitHub
# side is what lets a pull request from a fork render safely, since the config
# a contributor could edit never runs next to a token.

definitions:
  environment: &smoke_environment
    flutter: master
    vars:
      FLUTTER_DART_DATA_ASSETS: "true"
      # The channel to render on. Codemagic's `flutter:` key takes a literal,
      # so the image installs master and the channel script below switches when
      # a build asks for another one. Overridden per build through the API by
      # .github/workflows/codemagic_smoke.yml.
      FLUTTER_CHANNEL: "master"

  cache: &smoke_cache
    cache_paths:
      - ~/.pub-cache

  scripts:
    - &script_select_channel
      name: Select the Flutter channel
      # A release check renders against stable; everything else stays on the
      # master the image ships, so this is a no-op on the usual path.
      # FLUTTER_REVISION pins the SDK to one framework commit instead, for
      # bisecting a master regression against this matrix.
      script: |
        set -eu
        revision="${FLUTTER_REVISION:-}"
        if [ -n "$revision" ]; then
          root=$(dirname "$(dirname "$(command -v flutter)")")
          echo "Pinning Flutter at $revision in $root."
          git -C "$root" fetch --depth 1 origin "$revision"
          git -C "$root" checkout -q "$revision"
          flutter --version
          exit 0
        fi
        channel="${FLUTTER_CHANNEL:-master}"
        if [ "$channel" = "master" ]; then
          echo "Staying on the image's master Flutter."
          exit 0
        fi
        echo "Switching to the $channel channel."
        flutter channel "$channel"
        flutter upgrade --force

    - &script_versions
      name: Flutter and engine revision
      # Recorded as an artifact too, so the GitHub side can show which channel
      # a build actually rendered on instead of trusting that the request took.
      script: |
        mkdir -p "$CM_BUILD_DIR/examples/smoke_render/build"
        flutter --version | tee "$CM_BUILD_DIR/examples/smoke_render/build/flutter-version.txt"
        # The doctor block rides along so an upstream report about this
        # machine can quote it.
        flutter doctor -v >> "$CM_BUILD_DIR/examples/smoke_render/build/flutter-version.txt" 2>&1 || true

    - &script_assert_no_credentials
      name: Assert the build holds no credentials
      # Guards the invariant this whole split exists for. A credential reaching
      # a build that runs contributor source is the failure worth catching
      # loudly, so it fails rather than warns.
      script: |
        leaked=""
        for name in ARGOS_TOKEN DISCORD_WEBHOOK_URL CODEMAGIC_API_TOKEN; do
          eval "value=\${$name:-}"
          [ -n "$value" ] && leaked="$leaked $name"
        done
        if [ -n "$leaked" ]; then
          echo "Credentials present in a build that should have none,$leaked"
          exit 1
        fi
        echo "No credentials in this build, as expected."

    - &script_pub_get
      name: Resolve the workspace
      script: flutter pub get

    - &script_publish_status
      name: Publish the render status
      # The render's exit code travels to GitHub as an artifact rather than as
      # the build's own status, so a failed render still yields its frames.
      # Those frames are exactly what visual triage needs.
      script: |
        cd "$CM_BUILD_DIR/examples/smoke_render"
        ls -l build/smoke 2>/dev/null || echo "build/smoke does not exist"
        echo "frames: $(find build/smoke -type f -name '*.png' 2>/dev/null | wc -l | tr -d ' ')"
        cp "$CM_BUILD_DIR/smoke-status" build/smoke-status.txt
        echo "render exited $(cat build/smoke-status.txt)"

workflows:
  smoke-macos:
    name: Smoke render (macOS, Metal)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment: *smoke_environment
    cache: *smoke_cache
    scripts:
      - *script_select_channel
      - *script_versions
      - *script_assert_no_credentials
      - name: Enable the macOS desktop target
        script: >
          flutter config --enable-macos-desktop --enable-native-assets
          --enable-dart-data-assets
      - *script_pub_get
      - name: GPU memory accounting
        script: |
          cd "$CM_BUILD_DIR/examples/smoke_render"
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/memory_pressure_test.dart \
            -d macos --enable-impeller --enable-flutter-gpu
      - name: Render smoke scenes
        script: |
          cd "$CM_BUILD_DIR/examples/smoke_render"
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/smoke_test.dart \
            -d macos --enable-impeller --enable-flutter-gpu
          echo $? > "$CM_BUILD_DIR/smoke-status"
        ignore_failure: true
      - *script_publish_status
    artifacts:
      - examples/smoke_render/build/smoke/*.png
      - examples/smoke_render/build/smoke-status.txt
      - examples/smoke_render/build/flutter-version.txt

  smoke-ios:
    name: Smoke render (iOS simulator, Metal)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      <<: *smoke_environment
      # Pinned to the image this lane was stable on. Codemagic moved `latest`
      # to 26.6 (Xcode 26.6 on macOS 26.5.1) on 2026-09-06, and from then on
      # the iOS 26 simulator froze during boot or never launched the app in
      # roughly one build in three. Retry `latest` after the next image roll.
      xcode: 26.5
      vars:
        FLUTTER_DART_DATA_ASSETS: "true"
        SMOKE_SIM_DEVICE: iPhone 17 Pro
        # The Dart VM service port the render step launches the app on, so
        # the drive can attach to it directly (see that step).
        SMOKE_VM_SERVICE_PORT: "54321"
    cache: *smoke_cache
    scripts:
      - *script_select_channel
      - *script_versions
      - *script_assert_no_credentials
      - name: Generate the iOS project
        # examples/smoke_render commits every platform except ios/, so the
        # simulator target is scaffolded per build. The project name is explicit
        # because a bare create inherits the workspace root's `name: _`.
        script: |
          cd "$CM_BUILD_DIR/examples/smoke_render"
          flutter create . --platforms=ios --org dev.bdero \
            --project-name smoke_render || true
          # The tail-end gatherSdkPackageDependencies crash only fails a
          # redundant lockfile step, so success is judged by the project itself.
          test -d ios/Runner.xcodeproj
      - name: Enable native and data assets
        script: flutter config --enable-native-assets --enable-dart-data-assets
      - *script_pub_get
      - name: Boot the simulator
        # iOS 26 simulators freeze during boot now and then on macOS virtual
        # machines (Apple has the report), and `bootstatus -b` then waits
        # forever, which is how this lane ran to its 45 minute cap with no
        # artifacts. Every wait here is bounded: a boot that has not finished
        # in two minutes is shut down and tried again, twice.
        script: |
          udid=$(xcrun simctl list devices available \
            | sed -n "s/.*${SMOKE_SIM_DEVICE} (\([0-9A-F-]\{36\}\)).*/\1/p" \
            | head -1)
          if [ -z "$udid" ]; then
            echo "$SMOKE_SIM_DEVICE is unavailable; falling back to any iPhone."
            udid=$(xcrun simctl list devices available \
              | sed -n 's/.*iPhone.* (\([0-9A-F-]\{36\}\)).*/\1/p' | head -1)
          fi
          test -n "$udid"
          xcrun simctl list runtimes | grep -i ios || true

          # Runs a command with a deadline in seconds; 124 when it ran out.
          bounded() {
            local limit=$1; shift
            "$@" & local pid=$!
            local waited=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$waited" -ge "$limit" ]; then
                kill "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                return 124
              fi
              sleep 1; waited=$((waited + 1))
            done
            wait "$pid"
          }

          booted=0
          for attempt in 1 2 3; do
            echo "Boot attempt $attempt"
            bounded 60 xcrun simctl boot "$udid" || true
            if bounded 120 xcrun simctl bootstatus "$udid" -b; then
              booted=1
              break
            fi
            echo "The simulator did not finish booting in time; resetting it."
            bounded 60 xcrun simctl shutdown "$udid" || true
            # A device that froze mid-boot is not reused as is; erasing it
            # returns it to a clean state before the next attempt.
            bounded 60 xcrun simctl erase "$udid" || true
            sleep 5
          done
          if [ "$booted" -ne 1 ]; then
            echo "The simulator never booted after 3 attempts."
            xcrun simctl list devices | grep -i "$udid" || true
            exit 1
          fi
          echo "$udid" > "$CM_BUILD_DIR/smoke-sim-udid"
      - name: Render smoke scenes
        # `flutter drive` would launch the app and discover its Dart VM service
        # by reading the simulator's unified log (`simctl spawn ... log
        # stream`), and on this iOS 26 runtime that stream never delivers the
        # line, on any Flutter channel, while the app itself is up with the
        # service listening (the same log is readable afterwards with `log
        # show`). So the app is built, installed, and launched here on a fixed
        # VM service port, the port is polled, and the drive attaches to the
        # running app with --use-existing-app, which never touches the log.
        # Every wait is bounded, and the drive's output ships as an artifact.
        script: |
          cd "$CM_BUILD_DIR/examples/smoke_render"
          udid=$(cat "$CM_BUILD_DIR/smoke-sim-udid")
          port="${SMOKE_VM_SERVICE_PORT:-54321}"
          bundle_id=dev.bdero.smokeRender
          log="$CM_BUILD_DIR/examples/smoke_render/build/smoke-drive.log"
          started=$(date '+%Y-%m-%d %H:%M:%S')
          finish() { echo "$1" > "$CM_BUILD_DIR/smoke-status"; exit 0; }

          # Each command's own status decides, not the tee's, since the shell
          # here is not guaranteed to have pipefail.
          run() { "$@" > step.out 2>&1; st=$?; cat step.out; cat step.out >> "$log"; return $st; }

          echo "== build ==" | tee "$log"
          run flutter build ios --simulator --debug \
            --target=integration_test/smoke_test.dart || finish 2
          app=build/ios/iphonesimulator/Runner.app
          test -d "$app" || finish 2

          echo "== install and launch ==" | tee -a "$log"
          run xcrun simctl install "$udid" "$app" || finish 3
          # The same flags the tool would pass for a debug drive, plus the
          # fixed port and no auth code so the URL is known in advance.
          run xcrun simctl launch "$udid" "$bundle_id" \
            --enable-dart-profiling --disable-vm-service-publication \
            --enable-checked-mode --verify-entry-points \
            --vm-service-port="$port" --disable-service-auth-codes \
            --enable-impeller=true --enable-flutter-gpu || finish 3

          up=0
          for _ in $(seq 1 120); do
            if curl -sf "http://127.0.0.1:$port/" -o /dev/null; then up=1; break; fi
            sleep 1
          done
          if [ "$up" -ne 1 ]; then
            echo "The app never opened its VM service on port $port." | tee -a "$log"
            xcrun simctl spawn "$udid" log show --start "$started" --style compact \
              --predicate 'process == "Runner"' 2>/dev/null \
              | grep -v RunningBoard | tail -n 150 >> "$log" || true
            for report in $(ls -t "$HOME/Library/Logs/DiagnosticReports"/Runner* 2>/dev/null | head -2); do
              echo "--- $report ---" >> "$log"
              head -n 60 "$report" >> "$log"
            done
            finish 4
          fi
          echo "VM service is up on port $port." | tee -a "$log"

          echo "== drive ==" | tee -a "$log"
          flutter drive -v \
            --use-existing-app="http://127.0.0.1:$port/" \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/smoke_test.dart \
            -d "$udid" \
            --enable-impeller --enable-flutter-gpu 2>&1 | tee -a "$log" &
          pid=$!
          waited=0
          while kill -0 "$pid" 2>/dev/null; do
            if [ "$waited" -ge 900 ]; then
              echo "flutter drive is still running after 15 minutes; killing it." | tee -a "$log"
              xcrun simctl list devices | grep -i "$udid" | tee -a "$log" || true
              pkill -P "$pid" 2>/dev/null || true
              kill "$pid" 2>/dev/null || true
              sleep 5
              kill -9 "$pid" 2>/dev/null || true
              finish 124
            fi
            sleep 5; waited=$((waited + 5))
          done
          wait "$pid"
          status=$?
          xcrun simctl terminate "$udid" "$bundle_id" 2>/dev/null || true
          finish "$status"
        ignore_failure: true
      - *script_publish_status
    artifacts:
      - examples/smoke_render/build/smoke/*.png
      - examples/smoke_render/build/smoke-status.txt
      - examples/smoke_render/build/flutter-version.txt
      - examples/smoke_render/build/smoke-drive.log
