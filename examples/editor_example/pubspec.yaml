name: editor_example
description: Runnable example app for the flutter_scene editor.
publish_to: none
version: 0.1.0

resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: '>=3.29.0-1.0.pre.242'

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: ^0.21.0
  # The build hook's own dependency.
  hooks: ^2.0.0
  flutter_scene_editor:
    path: ../../packages/flutter_scene_editor
  flutter_scene_mcp:
    path: ../../packages/flutter_scene_mcp

flutter:
  uses-material-design: true
  assets:
    # Everything hook/build.dart generates, loaded by source path. Added
    # by `dart run flutter_scene:init`.
    - flutter_scene_generated/
