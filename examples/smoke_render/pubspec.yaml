name: smoke_render
description: "Deterministic render smoke tests for flutter_scene (dev-only, not published)."
publish_to: 'none'

version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  data_assets: ^0.20.0
  flutter:
    sdk: flutter
  flutter_gpu_shaders: ^0.5.1
  flutter_scene: ^0.23.0
  hooks: ^2.0.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # Skinned animated test model (assets_src is a symlink into
    # examples/assets_src), for the skinned_animation scene.
    - assets_src/two_triangles.glb
    # Draco-compressed quads sampling KHR_texture_basisu KTX2 textures, for
    # the basisu_textures scene. Rebuilt by assets_gen/generate.sh.
    - assets/basisu_quads_draco.glb
    # Everything hook/build.dart generates, loaded by source path. Added by
    # `dart run flutter_scene:init`.
    - flutter_scene_generated/
