name: flutter_scene_editor
description: >-
  The flutter_scene scene editor UI, built in Flutter. Panels, an interactive
  viewport, and gizmos that drive the headless editor core.
version: 0.0.1
# TODO(publish): drop publish_to once the editor is ready for pub.dev.
publish_to: 'none'

resolution: workspace

environment:
  sdk: ^3.10.0
  # Master builds sort below 3.47.0 and are excluded deliberately; the
  # windowing API the shell uses was renamed after stable.
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.0.0
  flutter_scene: ^0.23.0
  scene: ^0.3.0
  flutter_scene_codegen:
    path: ../flutter_scene_codegen
  flutter_scene_editor_core:
    path: ../flutter_scene_editor_core
  flutter_scene_mcp:
    path: ../flutter_scene_mcp
  data_assets: ^0.20.0
  hooks: ^2.0.0
  multi_split_view: ^3.6.0
  native_mouse_cursor: ^1.2.1
  two_dimensional_scrollables: ^0.5.0
  vector_math: ^2.1.4
  forui: ^0.25.0

dev_dependencies:
  file_selector_platform_interface: ^2.7.0
  flutter_gpu_shaders: ^0.5.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/flutter_scene_logo.png
