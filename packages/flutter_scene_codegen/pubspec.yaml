name: flutter_scene_codegen
description: Static extraction and code generation for annotated flutter_scene components.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  # The extractor reads the 13.x argument AST (ArgumentList.arguments is a
  # NodeList<Argument> and named arguments are NamedArgument), and 13 is
  # also the floor the SDK-pinned test package needs on current Flutter.
  analyzer: ">=13.0.0 <15.0.0"
  dart_style: ^3.1.9
  scene: ^0.3.0
  vector_math: ^2.1.4

dev_dependencies:
  test: ^1.26.0
