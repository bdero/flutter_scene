name: _
publish_to: none

environment:
  sdk: ^3.10.0

workspace:
  - packages/scene
  - packages/flutter_scene
  - packages/flutter_scene_codegen
  - packages/flutter_scene_rapier
  - packages/flutter_scene_soloud
  - packages/flutter_scene_fmod
  - packages/flutter_scene_net
  - packages/flutter_scene_input
  - packages/flutter_scene_box3d
  - packages/flutter_scene_editor_core
  - packages/flutter_scene_editor
  - packages/flutter_scene_mcp
  - examples/flutter_app
  - examples/flutter_gpu_shim_smoke
  - examples/smoke_render
  - examples/stress_bench
  - examples/editor_example
  - apps/flutter_scene_editor_app

# User defines are read from the workspace root, so every switch lives here.
# The editor and the smoke matrix's debug_view scene need the surface debug
# views compiled in: flutter_scene's own hook reads debug_views, and an app
# hook that builds engine assets or materials reads flutter_scene_debug_views
# under the app's name. The smoke-render app also has a data-assets lane (see
# examples/smoke_render/README.md), switched on with data_assets: true.
hooks:
  user_defines:
    flutter_scene:
      debug_views: true
    smoke_render:
      flutter_scene_debug_views: true
    example_app:
      flutter_scene_debug_views: true
    editor_example:
      flutter_scene_debug_views: true
