name: _
publish_to: none

environment:
  sdk: ^3.10.0

workspace:
  - packages/scene
  - packages/flutter_scene
  - packages/flutter_scene_codegen
  - packages/flutter_scene_rapier
  - packages/flutter_scene_soloud
  - packages/flutter_scene_fmod
  - packages/flutter_scene_net
  - packages/flutter_scene_box3d
  - packages/flutter_scene_editor_core
  - packages/flutter_scene_editor
  - packages/flutter_scene_mcp
  - examples/flutter_app
  - examples/flutter_gpu_shim_smoke
  - examples/smoke_render
  - examples/stress_bench
  - examples/editor_example
  - apps/flutter_scene_editor_app

# The smoke-render app has a data-assets lane (see examples/smoke_render/README.md).
# User defines are read from the workspace root, so the switch lives here.
# hooks:
#   user_defines:
#     smoke_render:
#       data_assets: true

# Temporary: three changes flutter_scene_net needs are open upstream and not
# yet published. Pointing at the branch carrying all three lets the code that
# uses them be written and tested now instead of waiting.
#
#   bdero/dashwire#6  RpcTarget.notOwner
#   bdero/dashwire#7  Rep listener removal
#   bdero/dashwire#8  the newest snapshot tick a peer has acknowledged
#
# Remove this block once a dashwire_replication carrying them is on pub, and
# raise the version constraint in packages/flutter_scene_net/pubspec.yaml to
# match. Nothing else in the workspace depends on these.
dependency_overrides:
  dashwire:
    git:
      url: https://github.com/ChxisB/dashwire.git
      ref: all-three-pending
      path: packages/dashwire
  dashwire_replication:
    git:
      url: https://github.com/ChxisB/dashwire.git
      ref: all-three-pending
      path: packages/dashwire_replication
